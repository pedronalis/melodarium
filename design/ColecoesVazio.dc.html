<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #cccccc; } a:hover { color: #dddddd; }
    .win { width: 1100px; height: 700px; background: #111111; color: #828282; display: flex; overflow: hidden; position: relative; }
    .rail { width: 56px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0; border-right: 1px solid #1a1a1a; }
    .rb { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
    .rb:hover { background: #191919; }
    .panel { width: 392px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; padding: 26px; background: linear-gradient(170deg, #1a1a1a 0%, #131313 55%, #111111 100%); }
    .pane { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 26px 26px 16px 26px; gap: 13px; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .disc { width: 52px; height: 52px; border-radius: 26px; background: #dddddd; display: flex; align-items: center; justify-content: center; }
    .tag { padding: 4px 11px; border-radius: 12px; background: #232323; color: #a4a4a4; font-size: 11px; }
    .tagnew { padding: 4px 11px; border-radius: 12px; border: 1px dashed #3c3c3c; color: #4a4a4a; font-size: 11px; }
    .ib { width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
    .ib:hover { background: #232323; }
    .col { display: flex; align-items: center; gap: 13px; height: 44px; padding: 0 13px; border-radius: 8px; cursor: pointer; transition: background .12s; }
    .col:hover { background: #232323 !important; }
    .veil { position: absolute; inset: 0; background: rgba(0,0,0,0.62); display: flex; align-items: center; justify-content: center; z-index: 9; }
    .box { width: 360px; background: #191919; border: 1px solid #262626; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 9px; }
    .field { height: 36px; padding: 0 9px; border-radius: 12px; background: #111111; border: 1px solid #3c3c3c; color: #dddddd; font-size: 12px; font-family: Inter, sans-serif; outline: none; }
    .bt { padding: 9px 18px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .bt.fill { background: #262626; color: #dddddd; }
    .bt.fill:hover { background: #232323; }
    .bt.out { border: 1px solid #262626; color: #5d5d5d; }
    .bt.out:hover { background: #232323; color: #dddddd; }
  </style>
</helmet>

<div class="win">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V5l10-2v13"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h11M4 18h7"/><circle cx="18" cy="16" r="3"/><path d="M21 16V7"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.1 13.9.9.6a1.4 1.4 0 0 1 .4 1.8l-1 1.7a1.4 1.4 0 0 1-1.7.6l-1-.4a7 7 0 0 1-1.6.9l-.2 1.1a1.4 1.4 0 0 1-1.4 1.2h-2a1.4 1.4 0 0 1-1.4-1.2l-.2-1.1a7 7 0 0 1-1.6-.9l-1 .4a1.4 1.4 0 0 1-1.7-.6l-1-1.7a1.4 1.4 0 0 1 .4-1.8l.9-.6a7 7 0 0 1 0-1.8l-.9-.6a1.4 1.4 0 0 1-.4-1.8l1-1.7a1.4 1.4 0 0 1 1.7-.6l1 .4a7 7 0 0 1 1.6-.9l.2-1.1A1.4 1.4 0 0 1 11.1 3h2a1.4 1.4 0 0 1 1.4 1.2l.2 1.1a7 7 0 0 1 1.6.9l1-.4a1.4 1.4 0 0 1 1.7.6l1 1.7a1.4 1.4 0 0 1-.4 1.8l-.9.6a7 7 0 0 1 0 1.8z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3.5v17l14-8.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14h2V5zM20 5l-10 7 10 7z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5v14h-2V5zM4 5l10 7-10 7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-heartfull" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.5-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.5 12 20 12 20z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <div class="rail">
    <div class="rb" style="background: #232323;"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #dddddd;"><use href="#i-playlist"/></svg></div>
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-list"/></svg></div>
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-mic"/></svg></div>
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-search"/></svg></div>
    <div style="flex-grow: 1;"></div>
    <div class="rb" style="opacity: 0.7;"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-settings"/></svg></div>
  </div>

  <div class="panel">
    <div style="width: 340px; height: 340px; border-radius: 16px; background: linear-gradient(145deg, #3a3a3a 0%, #262626 45%, #191919 100%); flex-shrink: 0; box-shadow: 0 18px 40px rgba(0,0,0,0.55);"></div>
    <div style="display: flex; align-items: flex-start; gap: 13px;">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 26px; font-weight: 700; color: #dddddd; letter-spacing: -0.02em; line-height: 1.1;">Vespers</span>
        <span style="font-size: 14px; color: #828282;">Ólafur Arnalds</span>
        <span style="font-size: 12px; color: #4a4a4a;">Island Songs · 2016 · FLAC 44.1 kHz</span>
      </div>
      <svg viewBox="0 0 24 24" width="19" height="19" style="flex-shrink: 0; color: #cccccc;"><use href="#i-heartfull"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="height: 3px; border-radius: 2px; background: #262626; position: relative;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 42%; border-radius: 2px; background: #cccccc;"></div>
        <div style="position: absolute; left: 42%; top: -3px; width: 9px; height: 9px; border-radius: 5px; background: #dddddd; margin-left: -4px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span class="mono" style="font-size: 11px; color: #5d5d5d;">1:47</span>
        <span class="mono" style="font-size: 11px; color: #5d5d5d;">4:12</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 26px;">
      <svg viewBox="0 0 24 24" width="17" height="17" style="color: #5d5d5d;"><use href="#i-shuffle"/></svg>
      <svg viewBox="0 0 24 24" width="20" height="20" style="color: #828282;"><use href="#i-prev"/></svg>
      <div class="disc"><svg viewBox="0 0 24 24" width="19" height="19" style="color: #111111;"><use href="#i-pause"/></svg></div>
      <svg viewBox="0 0 24 24" width="20" height="20" style="color: #828282;"><use href="#i-next"/></svg>
      <svg viewBox="0 0 24 24" width="17" height="17" style="color: #5d5d5d;"><use href="#i-repeat"/></svg>
    </div>
    <div style="display: flex; gap: 4px;">
      <span class="tag">piano</span>
      <span class="tag">chuva</span>
      <span class="tagnew">+ tag</span>
    </div>
  </div>

  <div class="pane">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 19px; font-weight: 600; color: #dddddd; letter-spacing: -0.01em;">Coleções</span>
      <span class="mono" style="font-size: 12px; color: #3c3c3c;">{{ headCount }}</span>
      <div style="flex-grow: 1;"></div>
      <div class="ib" onClick="{{ askNew }}"><svg viewBox="0 0 24 24" width="14" height="14" style="color: #5d5d5d;"><use href="#i-plus"/></svg></div>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; overflow: hidden;">
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
          <span style="width: 70%; text-align: center; font-size: 13px; line-height: 1.7; color: #5d5d5d;">Nenhuma coleção ainda.<br>Crie uma e jogue faixas dentro pelo + da lista.</span>
        </div>
      </sc-if>
      <sc-for list="{{ collections }}" as="c" hint-placeholder-count="1">
        <div class="col" style="background: {{ c.bg }};">
          <svg viewBox="0 0 24 24" width="15" height="15" style="flex-shrink: 0; color: #cccccc;"><use href="#i-playlist"/></svg>
          <span style="font-size: 13px; color: #dddddd; flex-grow: 1;">{{ c.name }}</span>
          <span class="mono" style="font-size: 12px; color: #3c3c3c;">{{ c.count }} faixas</span>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ asking }}" hint-placeholder-val="{{ false }}">
    <div class="veil">
      <div class="box">
        <span style="font-size: 14px; font-weight: 600; color: #dddddd;">Nova coleção</span>
        <input class="field" value="{{ newName }}" onChange="{{ typeNew }}" onKeyDown="{{ keyNew }}" placeholder="Para dormir">
        <div style="display: flex; justify-content: flex-end; gap: 6px;">
          <div class="bt out" onClick="{{ cancel }}">Cancelar</div>
          <div class="bt fill" onClick="{{ create }}">Criar</div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { collections: [], asking: false, newName: '' }
  }

  criar(nome) {
    const name = String(nome === undefined ? '' : nome).trim()
    if (name === '') {
      this.setState({ asking: false })
      return
    }
    this.setState({
      asking: false,
      newName: '',
      collections: this.state.collections.concat([{ name, count: 0 }])
    })
  }

  renderVals() {
    const s = this.state
    return {
      accent: this.props.accent ?? '#cccccc',
      isEmpty: s.collections.length === 0,
      headCount: s.collections.length + ' coleções',
      collections: s.collections.map((c, i) => ({
        name: c.name,
        count: String(c.count),
        bg: i % 2 === 1 ? '#151515' : 'transparent'
      })),
      asking: s.asking,
      newName: s.newName,
      askNew: () => this.setState({ asking: true, newName: '' }),
      cancel: () => this.setState({ asking: false, newName: '' }),
      typeNew: (e) => this.setState({ newName: e.target.value }),
      keyNew: (e) => { if (e.key === 'Enter') this.criar(e.target.value) },
      create: () => this.criar(s.newName)
    }
  }
}
</script>
</body>
</html>
