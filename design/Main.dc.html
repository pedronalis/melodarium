<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #cccccc; } a:hover { color: #dddddd; }
    .win { width: 1100px; height: 700px; background: #111111; color: #828282; display: flex; overflow: hidden; }
    .rail { width: 56px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0; border-right: 1px solid #1a1a1a; }
    .rb { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
    .rb:hover { background: #191919; }
    .panel { width: 392px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; padding: 26px; background: linear-gradient(170deg, #1a1a1a 0%, #131313 55%, #111111 100%); }
    .pane { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 26px 26px 16px 26px; gap: 16px; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .trk { display: flex; align-items: center; gap: 13px; padding: 9px 13px; border-radius: 12px; cursor: pointer; transition: background .12s; }
    .trk:hover { background: #232323 !important; }
    .btn { cursor: pointer; }
    .ghost { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 12px; border: 1px solid #262626; cursor: pointer; transition: background .15s; }
    .ghost:hover { background: #191919; }
    .disc { width: 52px; height: 52px; border-radius: 26px; background: #dddddd; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .tag { padding: 4px 11px; border-radius: 12px; background: #232323; color: #a4a4a4; font-size: 11px; cursor: pointer; }
    .tag:hover { background: #262626; }
    .tagnew { padding: 4px 11px; border-radius: 12px; border: 1px dashed #3c3c3c; color: #4a4a4a; font-size: 11px; cursor: pointer; }
    .tagnew:hover { background: #191919; color: #5d5d5d; }
    .tagin { width: 140px; height: 22px; padding: 0 9px; border-radius: 12px; background: #232323; border: 1px solid #5d5d5d; color: #a4a4a4; font-size: 11px; font-family: Inter, sans-serif; outline: none; }
    .menu { position: absolute; right: 0; top: 30px; min-width: 168px; background: #191919; border: 1px solid #262626; border-radius: 12px; padding: 5px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .mi { padding: 7px 11px; border-radius: 8px; font-size: 12px; color: #a4a4a4; cursor: pointer; }
    .mi:hover { background: #232323; color: #dddddd; }
    .qc { width: 62px; height: 62px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
    .qc:hover { border-color: #dddddd; }
  </style>
</helmet>

<div class="win">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M11 18V5l10-2v13"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h11M4 18h7"/><circle cx="18" cy="16" r="3"/><path d="M21 16V7"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.1 13.9.9.6a1.4 1.4 0 0 1 .4 1.8l-1 1.7a1.4 1.4 0 0 1-1.7.6l-1-.4a7 7 0 0 1-1.6.9l-.2 1.1a1.4 1.4 0 0 1-1.4 1.2h-2a1.4 1.4 0 0 1-1.4-1.2l-.2-1.1a7 7 0 0 1-1.6-.9l-1 .4a1.4 1.4 0 0 1-1.7-.6l-1-1.7a1.4 1.4 0 0 1 .4-1.8l.9-.6a7 7 0 0 1 0-1.8l-.9-.6a1.4 1.4 0 0 1-.4-1.8l1-1.7a1.4 1.4 0 0 1 1.7-.6l1 .4a7 7 0 0 1 1.6-.9l.2-1.1A1.4 1.4 0 0 1 11.1 3h2a1.4 1.4 0 0 1 1.4 1.2l.2 1.1a7 7 0 0 1 1.6.9l1-.4a1.4 1.4 0 0 1 1.7.6l1 1.7a1.4 1.4 0 0 1-.4 1.8l-.9.6a7 7 0 0 1 0 1.8z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3.5v17l14-8.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14h2V5zM20 5l-10 7 10 7z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5v14h-2V5zM4 5l10 7-10 7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.5 12 20 12 20z"/></symbol>
    <symbol id="i-heartfull" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.5-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.5 12 20 12 20z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
  </svg>

  <div class="rail">
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-playlist"/></svg></div>
    <div class="rb" style="background: #232323;"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #dddddd;"><use href="#i-list"/></svg></div>
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-mic"/></svg></div>
    <div class="rb"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-search"/></svg></div>
    <div style="flex-grow: 1;"></div>
    <div class="rb" style="opacity: 0.7;"><svg viewBox="0 0 24 24" width="17" height="17" style="color: #4a4a4a;"><use href="#i-settings"/></svg></div>
  </div>

  <div class="panel">
    <div style="width: 340px; height: 340px; border-radius: 16px; background: linear-gradient(145deg, #3a3a3a 0%, #262626 45%, #191919 100%); flex-shrink: 0; box-shadow: 0 18px 40px rgba(0,0,0,0.55);"></div>

    <div style="display: flex; align-items: flex-start; gap: 13px;">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 26px; font-weight: 700; color: #dddddd; letter-spacing: -0.02em; line-height: 1.1;">{{ nowTitle }}</span>
        <span style="font-size: 14px; color: #828282;">Ólafur Arnalds</span>
        <span style="font-size: 12px; color: #4a4a4a;">Island Songs · 2016 · FLAC 44.1 kHz</span>
      </div>
      <svg viewBox="0 0 24 24" width="19" height="19" class="btn" onClick="{{ likeNow }}" style="flex-shrink: 0; color: {{ nowHeartColor }};"><use href="{{ nowHeartIcon }}"/></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div class="btn" onClick="{{ seek }}" style="height: 3px; border-radius: 2px; background: #262626; position: relative;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #cccccc; width: {{ progressWidth }};"></div>
        <div style="position: absolute; top: -3px; width: 9px; height: 9px; border-radius: 5px; background: #dddddd; left: {{ progressWidth }}; margin-left: -4px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span class="mono" style="font-size: 11px; color: #5d5d5d;">{{ elapsed }}</span>
        <span class="mono" style="font-size: 11px; color: #5d5d5d;">{{ total }}</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 26px;">
      <svg viewBox="0 0 24 24" width="17" height="17" class="btn" onClick="{{ toggleShuffle }}" style="color: {{ shuffleColor }};"><use href="#i-shuffle"/></svg>
      <svg viewBox="0 0 24 24" width="20" height="20" class="btn" onClick="{{ prev }}" style="color: #828282;"><use href="#i-prev"/></svg>
      <div class="disc" onClick="{{ togglePlay }}">
        <svg viewBox="0 0 24 24" width="19" height="19" style="color: #111111;"><use href="{{ playIcon }}"/></svg>
      </div>
      <svg viewBox="0 0 24 24" width="20" height="20" class="btn" onClick="{{ next }}" style="color: #828282;"><use href="#i-next"/></svg>
      <div style="position: relative; display: flex;">
        <svg viewBox="0 0 24 24" width="17" height="17" class="btn" onClick="{{ cycleRepeat }}" style="color: {{ repeatColor }};"><use href="#i-repeat"/></svg>
        <span class="mono" style="position: absolute; right: -2px; bottom: -3px; font-size: 10px; font-weight: 700; color: {{ repeatOneColor }};">{{ repeatOneLabel }}</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px;">
      <svg viewBox="0 0 24 24" width="12" height="12" class="btn" onClick="{{ toggleMute }}" style="color: #5d5d5d;"><use href="#i-vol"/></svg>
      <div class="btn" onClick="{{ setVolume }}" style="width: 72px; height: 3px; border-radius: 2px; background: #262626;">
        <div style="height: 3px; border-radius: 2px; background: #5d5d5d; width: {{ volumeWidth }};"></div>
      </div>
    </div>

    <div style="display: flex; gap: 4px; flex-wrap: wrap;">
      <sc-for list="{{ tags }}" as="tag" hint-placeholder-count="2">
        <span class="tag">{{ tag }}</span>
      </sc-for>
      <sc-if value="{{ notEditingTag }}" hint-placeholder-val="{{ true }}">
        <span class="tagnew" onClick="{{ openTag }}">+ tag</span>
      </sc-if>
      <sc-if value="{{ editingTag }}" hint-placeholder-val="{{ false }}">
        <input class="tagin" placeholder="nova tag…" value="{{ tagText }}" onChange="{{ typeTag }}" onKeyDown="{{ keyTag }}">
      </sc-if>
    </div>
  </div>

  <div class="pane">
    <div style="display: flex; align-items: center; gap: 13px; position: relative;">
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <span style="font-size: 19px; font-weight: 600; color: #dddddd; letter-spacing: -0.01em;">Island Songs</span>
        <span style="font-size: 12px; color: #4a4a4a;">Ólafur Arnalds · 8 faixas · 35 min</span>
      </div>
      <div class="ghost" onClick="{{ toggleCollect }}">
        <svg viewBox="0 0 24 24" width="13" height="13" style="color: #5d5d5d;"><use href="#i-plus"/></svg>
        <span style="font-size: 12px; color: #6e6e6e;">{{ collectLabel }}</span>
      </div>
      <sc-if value="{{ collectOpen }}" hint-placeholder-val="{{ false }}">
        <div class="menu">
          <sc-for list="{{ collections }}" as="c" hint-placeholder-count="2">
            <div class="mi" onClick="{{ c.pick }}">{{ c.name }}</div>
          </sc-for>
          <div class="mi" style="color: #6e6e6e;" onClick="{{ closeCollect }}">Nova coleção…</div>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="8">
        <div class="trk" style="background: {{ t.bg }};" onClick="{{ t.play }}">
          <sc-if value="{{ t.current }}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 24 24" width="11" height="11" style="flex-shrink: 0; color: #cccccc;"><use href="#i-play"/></svg>
          </sc-if>
          <sc-if value="{{ t.idle }}" hint-placeholder-val="{{ false }}">
            <span class="mono" style="width: 11px; text-align: center; font-size: 11px; color: #3c3c3c; flex-shrink: 0;">{{ t.num }}</span>
          </sc-if>
          <span style="font-size: 13px; flex-grow: 1; color: {{ t.titleColor }}; font-weight: {{ t.titleWeight }};">{{ t.title }}</span>
          <svg viewBox="0 0 24 24" width="13" height="13" class="btn" onClick="{{ t.like }}" style="flex-shrink: 0; color: {{ t.heartColor }};"><use href="{{ t.heartIcon }}"/></svg>
          <span class="mono" style="font-size: 12px; color: {{ t.timeColor }};">{{ t.time }}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3c3c3c;">A seguir na fila</span>
        <span class="mono" style="font-size: 11px; color: #3c3c3c;">12 na fila</span>
      </div>
      <div style="display: flex; gap: 9px;">
        <sc-for list="{{ queue }}" as="q" hint-placeholder-count="4">
          <div class="qc" style="background: {{ q.art }};" onClick="{{ q.play }}"></div>
        </sc-for>
        <div style="width: 62px; height: 62px; border-radius: 12px; border: 1px dashed #262626; display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 11px; color: #3c3c3c;">+4</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#cccccc","options":["#cccccc","#8ab4f8","#c9a227","#7fb069"]},"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = {
      current: 0,
      playing: true,
      position: 107,
      liked: [true, false, false, true, false, false, true, false],
      shuffle: false,
      repeat: 0,
      volume: 68,
      muted: false,
      tags: ['piano', 'chuva'],
      editing: false,
      tagText: '',
      collectOpen: false,
      collected: ''
    }
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.playing) return
      const t = this.tracks()[this.state.current]
      this.setState({ position: this.state.position + 1 >= t.secs ? 0 : this.state.position + 1 })
    }, 1000)
  }

  componentWillUnmount() { clearInterval(this.timer) }

  tracks() {
    return [
      { title: 'Vespers', secs: 252 },
      { title: 'Saman', secs: 218 },
      { title: 'Particles', secs: 287 },
      { title: 'Dalur', secs: 192 },
      { title: 'Öldurót', secs: 302 },
      { title: 'Raddir', secs: 269 },
      { title: 'Doria', secs: 378 },
      { title: 'Árbakkinn', secs: 235 }
    ]
  }

  clock(secs) {
    const s = Math.max(0, Math.floor(secs))
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2)
  }

  fraction(event) {
    const box = event.currentTarget.getBoundingClientRect()
    return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width))
  }

  renderVals() {
    const accent = this.props.accent ?? '#cccccc'
    const s = this.state
    const list = this.tracks()
    const now = list[s.current]

    const tracks = list.map((t, i) => ({
      num: String(i + 1),
      title: t.title,
      time: this.clock(t.secs),
      current: i === s.current,
      idle: i !== s.current,
      bg: i === s.current ? '#1e1e1e' : 'transparent',
      titleColor: i === s.current ? '#dddddd' : '#a4a4a4',
      titleWeight: i === s.current ? '600' : '400',
      timeColor: i === s.current ? '#828282' : '#4a4a4a',
      heartIcon: s.liked[i] ? '#i-heartfull' : '#i-heart',
      heartColor: s.liked[i] ? accent : '#2f2f2f',
      play: () => this.setState({ current: i, position: 0, playing: true }),
      like: (e) => {
        e.stopPropagation()
        const liked = s.liked.slice()
        liked[i] = !liked[i]
        this.setState({ liked })
      }
    }))

    const upcoming = ['linear-gradient(140deg, #2e2e2e, #1a1a1a)',
                      'linear-gradient(140deg, #282828, #181818)',
                      'linear-gradient(140deg, #242424, #161616)',
                      'linear-gradient(140deg, #202020, #151515)']
    const queue = upcoming.map((art, i) => ({
      art,
      play: () => this.setState({ current: Math.min(list.length - 1, s.current + 1 + i), position: 0, playing: true })
    }))

    return {
      accent,
      nowTitle: now.title,
      elapsed: this.clock(s.position),
      total: this.clock(now.secs),
      progressWidth: Math.round((s.position / now.secs) * 100) + '%',
      playIcon: s.playing ? '#i-pause' : '#i-play',
      nowHeartIcon: s.liked[s.current] ? '#i-heartfull' : '#i-heart',
      nowHeartColor: s.liked[s.current] ? accent : '#2f2f2f',
      shuffleColor: s.shuffle ? accent : '#5d5d5d',
      repeatColor: s.repeat > 0 ? accent : '#5d5d5d',
      repeatOneLabel: s.repeat === 2 ? '1' : '',
      repeatOneColor: accent,
      volumeWidth: (s.muted ? 0 : s.volume) + '%',
      tags: s.tags,
      editingTag: s.editing,
      notEditingTag: !s.editing,
      tagText: s.tagText,
      collectOpen: s.collectOpen,
      collectLabel: s.collected === '' ? 'Coleção' : 'em ' + s.collected,
      collections: [
        { name: 'Para dormir', pick: () => this.setState({ collectOpen: false, collected: 'Para dormir' }) },
        { name: 'Corrida', pick: () => this.setState({ collectOpen: false, collected: 'Corrida' }) }
      ],
      tracks,
      queue,
      togglePlay: () => this.setState({ playing: !s.playing }),
      prev: () => this.setState({ current: Math.max(0, s.current - 1), position: 0 }),
      next: () => this.setState({ current: Math.min(list.length - 1, s.current + 1), position: 0 }),
      toggleShuffle: () => this.setState({ shuffle: !s.shuffle }),
      cycleRepeat: () => this.setState({ repeat: (s.repeat + 1) % 3 }),
      toggleMute: () => this.setState({ muted: !s.muted }),
      setVolume: (e) => this.setState({ volume: Math.round(this.fraction(e) * 100), muted: false }),
      seek: (e) => this.setState({ position: Math.round(this.fraction(e) * now.secs) }),
      likeNow: () => {
        const liked = s.liked.slice()
        liked[s.current] = !liked[s.current]
        this.setState({ liked })
      },
      openTag: () => this.setState({ editing: true, tagText: '' }),
      typeTag: (e) => this.setState({ tagText: e.target.value }),
      keyTag: (e) => {
        if (e.key !== 'Enter') return
        const name = e.target.value.trim()
        this.setState({ editing: false, tagText: '', tags: name === '' ? s.tags : s.tags.concat([name]) })
      },
      toggleCollect: () => this.setState({ collectOpen: !s.collectOpen }),
      closeCollect: () => this.setState({ collectOpen: false })
    }
  }
}
</script>
</body>
</html>
