<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #cccccc; } a:hover { color: #dddddd; }
    .stage { width: 560px; height: 340px; background: #111111; display: flex; align-items: center; justify-content: center; }
    .box { width: 460px; background: #191919; border: 1px solid #262626; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
    .field { height: 36px; padding: 0 9px; border-radius: 12px; background: #111111; color: #dddddd; font-size: 13px; font-family: Inter, sans-serif; outline: none; }
    .bt { padding: 9px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .bt.fill { background: #262626; color: #dddddd; }
    .bt.fill:hover { background: #232323; }
    .bt.out { border: 1px solid #262626; color: #5d5d5d; }
    .bt.out:hover { background: #232323; color: #dddddd; }
  </style>
</helmet>

<div class="stage">
  <div class="box">
    <span style="font-size: 14px; font-weight: 600; color: #dddddd;">Assinar podcast</span>
    <span style="font-size: 12px; color: #5d5d5d;">Cole o endereço do feed RSS do programa.</span>
    <input class="field" style="border: 1px solid {{ fieldBorder }};" value="{{ url }}" onChange="{{ type }}" onKeyDown="{{ key }}" onFocus="{{ focus }}" onBlur="{{ blur }}" placeholder="https://exemplo.com/feed.xml">
    <sc-if value="{{ hasWarning }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #cf6679;">O endereço tem de começar com http:// ou https://.</span>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #828282;">{{ doneLabel }}</span>
    </sc-if>
    <span style="font-size: 11px; color: #5d5d5d; line-height: 1.5;">Verifica novos episódios enquanto o melodarium está aberto.</span>
    <div style="display: flex; justify-content: flex-end; gap: 6px;">
      <div class="bt out" onClick="{{ cancel }}">Cancelar</div>
      <div class="bt fill" onClick="{{ confirm }}">{{ confirmLabel }}</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#cccccc","options":["#cccccc","#8ab4f8","#c9a227","#7fb069"]},"$preview":{"width":560,"height":340}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { url: '', focused: false, warning: false, checking: false, done: '' }
  }

  componentWillUnmount() { clearTimeout(this.timer) }

  tentar(valor) {
    const t = String(valor === undefined ? '' : valor).trim()
    if (t.indexOf('http://') !== 0 && t.indexOf('https://') !== 0) {
      this.setState({ warning: true, done: '' })
      return
    }
    this.setState({ warning: false, checking: true, done: '' })
    clearTimeout(this.timer)
    this.timer = setTimeout(() => this.setState({
      checking: false,
      done: 'assinado — 3 episódios novos'
    }), 1200)
  }

  renderVals() {
    const accent = this.props.accent ?? '#cccccc'
    const s = this.state
    return {
      accent,
      url: s.url,
      fieldBorder: s.focused ? accent : '#3c3c3c',
      hasWarning: s.warning,
      done: s.done !== '',
      doneLabel: s.done,
      confirmLabel: s.checking ? 'verificando…' : 'Assinar',
      focus: () => this.setState({ focused: true }),
      blur: () => this.setState({ focused: false }),
      type: (e) => this.setState({ url: e.target.value, warning: false, done: '' }),
      key: (e) => { if (e.key === 'Enter') this.tentar(e.target.value) },
      confirm: () => this.tentar(s.url),
      cancel: () => this.setState({ url: '', warning: false, done: '' })
    }
  }
}
</script>
</body>
</html>
