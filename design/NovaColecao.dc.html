<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #cccccc; } a:hover { color: #dddddd; }
    .stage { width: 460px; height: 260px; background: #111111; display: flex; align-items: center; justify-content: center; }
    .box { width: 360px; background: #191919; border: 1px solid #262626; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
    .field { height: 36px; padding: 0 9px; border-radius: 12px; background: #111111; color: #dddddd; font-size: 13px; font-family: Inter, sans-serif; outline: none; }
    .bt { padding: 9px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .bt.fill { background: #262626; color: #dddddd; }
    .bt.fill:hover { background: #232323; }
    .bt.out { border: 1px solid #262626; color: #5d5d5d; }
    .bt.out:hover { background: #232323; color: #dddddd; }
  </style>
</helmet>

<div class="stage">
  <div class="box">
    <span style="font-size: 14px; font-weight: 600; color: #dddddd;">{{ title }}</span>
    <input class="field" style="border: 1px solid {{ fieldBorder }};" value="{{ name }}" onChange="{{ type }}" onKeyDown="{{ key }}" onFocus="{{ focus }}" onBlur="{{ blur }}" placeholder="Para dormir">
    <sc-if value="{{ hasWarning }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #cf6679;">Já existe uma coleção com esse nome.</span>
    </sc-if>
    <sc-if value="{{ created }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #828282;">{{ createdLabel }}</span>
    </sc-if>
    <div style="display: flex; justify-content: flex-end; gap: 6px;">
      <div class="bt out" onClick="{{ cancel }}">Cancelar</div>
      <div class="bt fill" onClick="{{ confirm }}">{{ confirmLabel }}</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"modo":{"editor":"enum","options":["criar","renomear"],"default":"criar"},"accent":{"editor":"color","default":"#cccccc","options":["#cccccc","#8ab4f8","#c9a227","#7fb069"]},"$preview":{"width":460,"height":260}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { name: '', focused: false, warning: false, created: '' }
  }

  renderVals() {
    const accent = this.props.accent ?? '#cccccc'
    const rename = (this.props.modo ?? 'criar') === 'renomear'
    const s = this.state
    const existentes = ['para dormir', 'corrida', 'foco profundo']

    return {
      accent,
      title: rename ? 'Renomear coleção' : 'Nova coleção',
      confirmLabel: rename ? 'Renomear' : 'Criar',
      name: s.name,
      fieldBorder: s.focused ? accent : '#3c3c3c',
      hasWarning: s.warning,
      created: s.created !== '',
      createdLabel: s.created,
      focus: () => this.setState({ focused: true }),
      blur: () => this.setState({ focused: false }),
      type: (e) => this.setState({ name: e.target.value, warning: false, created: '' }),
      key: (e) => { if (e.key === 'Enter') this.tentar(e.target.value, rename) },
      confirm: () => this.tentar(s.name, rename),
      cancel: () => this.setState({ name: '', warning: false, created: '' })
    }
  }

  tentar(valor, rename) {
    const nome = String(valor === undefined ? '' : valor).trim()
    if (nome === '') return
    const existentes = ['para dormir', 'corrida', 'foco profundo']
    if (existentes.indexOf(nome.toLowerCase()) >= 0) {
      this.setState({ warning: true, created: '' })
      return
    }
    this.setState({
      warning: false,
      created: rename ? 'renomeada para "' + nome + '"' : '"' + nome + '" criada'
    })
  }
}
</script>
</body>
</html>
