<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #cccccc; } a:hover { color: #dddddd; }
    .stage { width: 620px; height: 420px; background: #111111; display: flex; align-items: center; justify-content: center; }
    .box { width: 520px; background: #191919; border: 1px solid #262626; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
    .field { height: 36px; padding: 0 9px; border-radius: 12px; background: #111111; color: #dddddd; font-size: 13px; font-family: Inter, sans-serif; outline: none; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bt { padding: 9px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .bt.fill { background: #262626; color: #dddddd; }
    .bt.fill:hover { background: #232323; }
    .bt.out { border: 1px solid #262626; color: #5d5d5d; }
    .bt.out:hover { background: #232323; color: #dddddd; }
    .yt { padding: 1px 6px; border-radius: 7px; border: 1px solid #262626; font-size: 10px; color: #5d5d5d; }
  </style>
</helmet>

<div class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m8 12 4 4 4-4"/><path d="M5 19h14"/></symbol>
  </svg>

  <div class="box">
    <span style="font-size: 14px; font-weight: 600; color: #dddddd;">Adicionar link</span>
    <span style="font-size: 12px; color: #5d5d5d; line-height: 1.6;">O áudio do YouTube é comprimido e nunca terá a qualidade dos seus arquivos. Ele entra marcado como tal.</span>

    <input class="field" style="border: 1px solid {{ fieldBorder }};" value="{{ url }}" onChange="{{ type }}" onKeyDown="{{ key }}" onFocus="{{ focus }}" onBlur="{{ blur }}" placeholder="https://www.youtube.com/watch?v=…">

    <sc-if value="{{ hasWarning }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #cf6679;">{{ warning }}</span>
    </sc-if>

    <sc-if value="{{ hasInfo }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 9px; padding: 9px; border-radius: 12px; background: #151515; border: 1px solid #262626;">
        <div style="width: 72px; height: 45px; border-radius: 8px; background: linear-gradient(140deg, #2e2e2e, #1a1a1a); flex-shrink: 0;"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 13px; font-weight: 500; color: #dddddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Weightless (Official Audio)</span>
          <span style="font-size: 12px; color: #3c3c3c;">Marconi Union · 8:10</span>
        </div>
        <span class="yt">YouTube</span>
      </div>
    </sc-if>

    <sc-if value="{{ downloading }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg viewBox="0 0 24 24" width="13" height="13" style="color: #5d5d5d;"><use href="#i-down"/></svg>
        <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #111111;">
          <div style="height: 3px; border-radius: 2px; background: {{ accent }}; width: {{ pctWidth }};"></div>
        </div>
        <span class="mono" style="font-size: 11px; color: #5d5d5d;">{{ pctLabel }}</span>
      </div>
    </sc-if>

    <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; color: #828282;">baixado e posto em "Para dormir"</span>
    </sc-if>

    <div style="display: flex; justify-content: flex-end; gap: 6px;">
      <div class="bt out" onClick="{{ cancel }}">Cancelar</div>
      <div class="bt fill" onClick="{{ confirm }}">{{ confirmLabel }}</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#cccccc","options":["#cccccc","#8ab4f8","#c9a227","#7fb069"]},"$preview":{"width":620,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { url: '', focused: false, warning: '', info: false, pct: -1, done: false }
  }

  componentWillUnmount() { clearInterval(this.timer) }

  buscar(valor) {
    const t = String(valor === undefined ? '' : valor).trim()
    if (t.indexOf('http') !== 0) {
      this.setState({ warning: 'Cole o endereço completo do vídeo (começa com https://).', info: false })
      return
    }
    this.setState({ warning: '', info: true, pct: -1, done: false })
  }

  baixar() {
    this.setState({ pct: 0, done: false })
    clearInterval(this.timer)
    this.timer = setInterval(() => {
      const pct = this.state.pct + 8
      if (pct >= 100) {
        clearInterval(this.timer)
        this.setState({ pct: -1, done: true, info: false })
      } else {
        this.setState({ pct })
      }
    }, 400)
  }

  renderVals() {
    const accent = this.props.accent ?? '#cccccc'
    const s = this.state
    return {
      accent,
      url: s.url,
      fieldBorder: s.focused ? accent : '#3c3c3c',
      warning: s.warning,
      hasWarning: s.warning !== '',
      hasInfo: s.info,
      downloading: s.pct >= 0,
      pctWidth: Math.max(0, s.pct) + '%',
      pctLabel: Math.max(0, s.pct) + '%',
      finished: s.done,
      confirmLabel: s.info ? 'Baixar' : 'Buscar',
      focus: () => this.setState({ focused: true }),
      blur: () => this.setState({ focused: false }),
      type: (e) => this.setState({ url: e.target.value, warning: '', done: false }),
      key: (e) => { if (e.key === 'Enter') this.buscar(e.target.value) },
      confirm: () => { if (s.info) this.baixar(); else this.buscar(s.url) },
      cancel: () => {
        clearInterval(this.timer)
        this.setState({ url: '', warning: '', info: false, pct: -1, done: false })
      }
    }
  }
}
</script>
</body>
</html>
