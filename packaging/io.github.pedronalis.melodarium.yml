id: io.github.pedronalis.melodarium
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: melodarium

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.melodarium

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-test
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dbuild-date=false
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dpulse=enabled
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: taglib
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_BINDINGS=OFF
    sources:
      - type: git
        url: https://github.com/taglib/taglib.git
        tag: v2.3.1
        commit: 54ae7d8ac45755e286a5c574280f48d5bef93aef

  - name: melodarium
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
