name: Bug report / Relato de bug
description: Report a reproducible problem in English or Portuguese.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Melodarium. English and Portuguese are equally welcome.

        Obrigado por ajudar o Melodarium. Português e inglês são igualmente bem-vindos.

        For security issues, stop here and use the private advisory link in SECURITY.md.
        Para vulnerabilidades, pare aqui e use o advisory privado indicado em SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary / Resumo
      description: What happened? / O que aconteceu?
      placeholder: A short, concrete description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction / Reprodução
      description: List the smallest sequence that triggers the problem.
      placeholder: |
        1. Open… / Abra…
        2. Select… / Selecione…
        3. Observe… / Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Comportamento atual
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit / Versão ou commit
      placeholder: v0.1.0 or git rev-parse --short HEAD
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Linux distribution / Distribuição Linux
      placeholder: Fedora 43
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Desktop session / Sessão gráfica
      options:
        - Wayland — Hyprland
        - Wayland — GNOME/KDE/other
        - X11
        - Headless/offscreen test
        - Unknown / Não sei
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / Evidência higienizada
      description: Add relevant logs or screenshots after removing paths, feeds and personal media.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Checagem de privacidade
      options:
        - label: I removed personal paths, feed tokens, databases and copyrighted media from attachments. / Removi caminhos pessoais, tokens, bancos e mídia protegida dos anexos.
          required: true
        - label: I searched existing issues for the same problem. / Procurei o mesmo problema nas issues existentes.
          required: true
